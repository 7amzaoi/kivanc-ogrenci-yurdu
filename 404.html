<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayfa bulunamadı — Kıvanç Kız Yurdu</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#191411" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon.png" />

  <!-- Deliberately self-contained. A 404 is served for unknown paths at any
       depth, so relative links to css/main.css would break on /a/b/c; and if
       the stylesheet itself is what failed to load, the page must still read. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-block-size: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background: #FBF8F3;
      color: #3A322C;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      text-align: center;
    }
    main { max-inline-size: 34rem; }
    .code {
      font-family: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
      font-size: clamp(4rem, 18vw, 7.5rem);
      line-height: 1;
      color: #8A6524;
      margin: 0 0 0.5rem;
    }
    h1 {
      font-family: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(1.35rem, 5vw, 1.9rem);
      color: #191411;
      margin: 0 0 0.75rem;
    }
    p { margin: 0 0 0.35rem; }
    .en { color: #756B61; font-size: 0.95rem; }
    .actions {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      justify-content: center; margin-block-start: 2rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.85rem 1.6rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid #8A6524;
    }
    a.primary { background: #8A6524; color: #FBF8F3; }
    a.ghost   { color: #8A6524; }
    a.btn:hover  { opacity: 0.88; }
    a.btn:focus-visible { outline: 3px solid #8A6524; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Bağlantı taşınmış veya silinmiş olabilir.</p>
    <p class="en">Sorry — that page doesn’t exist. It may have moved or been removed.</p>

    <div class="actions">
      <a class="btn primary" href="/">Ana sayfa · Home</a>
      <a class="btn ghost" href="https://wa.me/905415904445" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </main>
</body>
</html>
